<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FBL Draft Intelligence</title><style>body{font:16px system-ui;background:#101827;color:#f4f6fc;max-width:780px;margin:auto;padding:18px}button,input,textarea{font:inherit;padding:10px;border-radius:9px;margin:5px 0}button{background:#69c7a3;border:0}input,textarea{background:#233047;color:white;border:1px solid #566}section{background:#1b2739;border-radius:14px;padding:14px;margin:12px 0}small{color:#c1c9d7}li{margin:8px 0}</style></head><body><h1>FBL Draft Intelligence</h1><small>Версия 0.1 • без вымышленных данных NBA</small><section><h2>Настройки</h2><label>Salary Cap <input id="cap" type="number" value="20000"></label><p><button id="reset">Новый драфт</button><button id="download">Экспорт JSON</button></p><input type="file" id="restore" accept=".json"><p><small>Импорт справочника: JSON объект с полем players. Обязательные поля: id (NBA ID), name, positions, price, priceStatus="VERIFIED". projectedFP необязателен.</small></p><textarea id="data" rows="4" style="width:95%" placeholder='{"players":[{"id":1,"name":"Имя","positions":["PG"],"price":1000,"priceStatus":"VERIFIED"}]}'></textarea><button id="load">Загрузить игроков</button></section><section><h2 id="turn">Пик 1 / 80</h2><input id="search" placeholder="Поиск игрока" style="width:90%"><div id="candidates"></div></section><section><h2>История</h2><button id="undo">Отменить последний пик</button><ol id="history"></ol></section><section><h2>Рекомендации</h2><div id="advice"></div></section><script type="module" src="./src/main.js"></script></body></html>
