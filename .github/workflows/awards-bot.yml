name: Awards bot
# The league's awards bot (awards-bot/): its own Telegram bot and state branch data/awards-bot. It posts into the league
# chat, where Zak Onn's feed posts too (LEAGUE_TELEGRAM_CHAT_ID, unless AWARDS_CHAT_ID names another chat), with its own
# token: nothing else is shared with the season watcher or its bots, and it only reads the project's data. Runs form a
# chain: each stays about five and a half hours and then starts the next one itself, so the bot does not depend on
# GitHub's schedule (best-effort, often hours late; the cron below only restarts a broken chain). A run sleeps until the
# day's last game is about to tip off, waits for the tip-off, checks every minute until every game is over and posts the
# game day at once. Then the
# week and the awards race after Sunday's games, and the month's five after its last game day.
# Run it by hand with a US game day to preview that day's posts (nothing saved or sent).
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: 'US game day to preview, YYYY-MM-DD (nothing saved or sent). Empty: a normal run.'
        required: false
        default: ''
      resend:
        description: 'US game day whose post is sent to the league again, YYYY-MM-DD (nothing else posted or saved).'
        required: false
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: awards-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Preview a game day
        if: inputs.preview != ''
        run: node awards-bot/bot.mjs --preview "${{ inputs.preview }}" --week --month
      - name: Load the bot's state
        if: inputs.preview == ''
        run: |
          mkdir -p "$RUNNER_TEMP/awards"
          # The state is what was already posted: a run that cannot read it must not start from nothing (it would post
          # the day again). Only a missing branch is a first run.
          for i in 1 2 3 4 5; do
            git fetch -q origin data/awards-bot:refs/remotes/origin/data/awards-bot && break
            if [ "$i" = 5 ]; then
              code=0; git ls-remote --exit-code origin data/awards-bot >/dev/null || code=$?
              [ "$code" = 2 ] && { echo "First run: no state yet"; exit 0; }
              echo "Cannot fetch data/awards-bot: not starting from an empty state"; exit 1
            fi
            sleep $((i * 10))
          done
          git show origin/data/awards-bot:state.json > "$RUNNER_TEMP/awards/state.json"
          git show origin/data/awards-bot:archive.json > "$RUNNER_TEMP/awards/archive.json"
      - name: Archive games and post
        if: inputs.preview == ''
        env:
          AWARDS_BOT_TOKEN: ${{ secrets.AWARDS_BOT_TOKEN }}
          AWARDS_CHAT_ID: ${{ secrets.AWARDS_CHAT_ID || secrets.LEAGUE_TELEGRAM_CHAT_ID }}
          AWARDS_COMMISSIONER_CHAT_ID: ${{ secrets.AWARDS_COMMISSIONER_CHAT_ID }}
          # The day's pictures (awards-bot/images.js); without the key the bot posts the texts only.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # How many heroes and flops get a picture (repository variable; empty: 3, 0: none).
          AWARDS_IMAGES_PER_BLOCK: ${{ vars.AWARDS_IMAGES_PER_BLOCK }}
          RESEND: ${{ inputs.resend }}
          # One run follows a day for at most this long, then saves; the next hourly run goes on.
          WATCH_MINUTES: '330'
          CHAIN: '1'
          GH_TOKEN: ${{ github.token }}
        run: node awards-bot/bot.mjs --state "$RUNNER_TEMP/awards" ${RESEND:+--resend "$RESEND"}
      - name: Save the bot's state
        # The bot pushes the state after every post; this saves the archive at the end, a cancelled run too.
        if: always() && inputs.preview == '' && inputs.resend == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/awards"
          [ -f state.json ] || exit 0
          [ -d .git ] || git init -q -b data/awards-bot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json archive.json
          git commit -q --allow-empty -m "Awards bot state $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data/awards-bot && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Start the next run
        # The chain goes on whatever this run did; a cancelled run starts nothing (the cron restarts the chain).
        if: inputs.preview == '' && inputs.resend == '' && (success() || failure())
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do gh workflow run awards-bot.yml --ref "${{ github.ref_name }}" -R "${GITHUB_REPOSITORY}" && exit 0; sleep $((i * 20)); done
          exit 1
