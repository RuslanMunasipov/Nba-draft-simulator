name: Awards bot
# The league's awards bot (awards-bot/): its own Telegram bot and state branch data/awards-bot. It posts into the league
# chat, where Zak Onn's feed posts too (LEAGUE_TELEGRAM_CHAT_ID, unless AWARDS_CHAT_ID names another chat), with its own
# token: nothing else is shared with the season watcher or its bots, and it only reads the project's data. Runs form a
# chain: each stays about five and a half hours and then starts the next one itself, so the bot does not depend on
# GitHub's schedule (best-effort, often hours late; the cron below only restarts a broken chain). A run sleeps until the
# day's last game is about to tip off, waits for the tip-off, checks every minute until every game is over and posts the
# game day at once. Then the
# week and the awards race after Sunday's games, and the month's five after its last game day.
# Run it by hand with a US game day to preview that day's posts (nothing saved or sent).
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: 'US game day to preview, YYYY-MM-DD (nothing saved or sent). Empty: a normal run.'
        required: false
        default: ''
      resend:
        description: 'US game day whose post is sent to the league again, YYYY-MM-DD (nothing else posted or saved).'
        required: false
        default: ''
      holiday:
        description: 'Cards of a preview or a resend: a holiday key of awards-bot/holidays.js, or none for no holiday decor. Empty: the calendar.'
        required: false
        default: ''
permissions:
  contents: write
  actions: write
# A preview or a resend only reads the state: it runs beside the chain instead of waiting hours behind it (where the next
# pending run of the group would cancel it).
concurrency:
  group: ${{ inputs.preview && 'awards-bot-preview' || inputs.resend && 'awards-bot-resend' || 'awards-bot' }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # The posts are albums of cards drawn with Chromium (awards-bot/render.mjs); without it the bot posts their text.
      - run: npx playwright install --with-deps chromium
      # The bots' texts are written by Claude through the owner's subscription (scripts/claude-text.mjs): the Claude Code
      # CLI, pinned. A failed install only leaves the bots without written texts.
      - name: Install Claude Code
        continue-on-error: true
        run: npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.308 && claude --version
      - name: Preview a game day
        if: inputs.preview != ''
        # The day's two pictures only as prompts (--prompts): their moments written by Claude through the subscription,
        # nothing drawn, nothing billed.
        env:
          HOLIDAY: ${{ inputs.holiday }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node awards-bot/bot.mjs --preview "${{ inputs.preview }}" --week --month --prompts ${HOLIDAY:+--holiday "$HOLIDAY"}
      - name: Load the bot's state
        if: inputs.preview == ''
        run: |
          mkdir -p "$RUNNER_TEMP/awards"
          # The state is what was already posted: a run that cannot read it must not start from nothing (it would post
          # the day again). Only a missing branch is a first run.
          for i in 1 2 3 4 5; do
            git fetch -q origin data/awards-bot:refs/remotes/origin/data/awards-bot && break
            if [ "$i" = 5 ]; then
              code=0; git ls-remote --exit-code origin data/awards-bot >/dev/null || code=$?
              [ "$code" = 2 ] && { echo "First run: no state yet"; exit 0; }
              echo "Cannot fetch data/awards-bot: not starting from an empty state"; exit 1
            fi
            sleep $((i * 10))
          done
          git show origin/data/awards-bot:state.json > "$RUNNER_TEMP/awards/state.json"
          git show origin/data/awards-bot:archive.json > "$RUNNER_TEMP/awards/archive.json"
      - name: Archive games and post
        if: inputs.preview == ''
        env:
          AWARDS_BOT_TOKEN: ${{ secrets.AWARDS_BOT_TOKEN }}
          AWARDS_CHAT_ID: ${{ secrets.AWARDS_CHAT_ID || secrets.LEAGUE_TELEGRAM_CHAT_ID }}
          AWARDS_COMMISSIONER_CHAT_ID: ${{ secrets.AWARDS_COMMISSIONER_CHAT_ID }}
          # Mike Roffon's flash interview after the day's post (awards-bot/mike-roffon.js): his own bot, written by Claude
          # (CLAUDE_CODE_OAUTH_TOKEN below), drawn by OpenAI. Without his token or Claude's there is no interview; without
          # the OpenAI key it goes without its picture.
          MIKE_ROFFON_BOT_TOKEN: ${{ secrets.MIKE_ROFFON_BOT_TOKEN }}
          # Christopher Dildo, the analyst of Inside FBL (awards-bot/dildo.js): the day's album, the day's pictures and the
          # week's heroes go out by his own bot into the same chat, with his comment (written by Claude); without his token,
          # or when Telegram refuses it, by the awards bot.
          CHRISTOPHER_DILDO_BOT_TOKEN: ${{ secrets.CHRISTOPHER_DILDO_BOT_TOKEN }}
          # Trevor Matolog, the league's trauma doctor (awards-bot/trevor-matolog.js): 20 minutes after Mike's interview, his
          # report from the infirmary by his own bot: the FBL rosters' injured players from ESPN's injury report of that
          # moment, its comments in Russian, the ward's pictures. Without his token there is no report.
          TREVOR_MATOLOG_BOT_TOKEN: ${{ secrets.TREVOR_MATOLOG_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The subscription token of Claude Code (`claude setup-token`) for the bots' texts; no API key.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The day's two pictures, heroes and flops (awards-bot/images.js), their moments written by Claude, drawn by
          # OpenAI after the day's album (about $0.05 a day): on, by the league owner's word (22.10.2026).
          DAY_PICTURES: '1'
          RESEND: ${{ inputs.resend }}
          HOLIDAY: ${{ inputs.resend && inputs.holiday || '' }}
          # One run follows a day for at most this long, then saves; the next hourly run goes on.
          WATCH_MINUTES: '330'
          CHAIN: '1'
          GH_TOKEN: ${{ github.token }}
        run: node awards-bot/bot.mjs --state "$RUNNER_TEMP/awards" ${RESEND:+--resend "$RESEND"} ${HOLIDAY:+--holiday "$HOLIDAY"}
      - name: Save the bot's state
        # The bot pushes the state after every post; this saves the archive at the end, a cancelled run too.
        if: always() && inputs.preview == '' && inputs.resend == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/awards"
          [ -f state.json ] || exit 0
          [ -d .git ] || git init -q -b data/awards-bot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json archive.json
          [ -f site.json ] && git add site.json
          git commit -q --allow-empty -m "Awards bot state $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data/awards-bot && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Start the next run
        # The chain goes on whatever this run did; a cancelled run starts nothing (the cron restarts the chain).
        if: inputs.preview == '' && inputs.resend == '' && (success() || failure())
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do gh workflow run awards-bot.yml --ref "${{ github.ref_name }}" -R "${GITHUB_REPOSITORY}" && exit 0; sleep $((i * 20)); done
          exit 1
