name: Season live data
# One long run at a time: FBL transfer journals every minute, the full Sports.ru collection every two hours.
# Each run lasts just under six hours and then starts the next one itself: GitHub schedules are best-effort
# and skipped runs are common, so the cron below is only a fallback. Cancel a run to stop the chain.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: season-live
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Start from the last published snapshot and alert state
        run: |
          mkdir -p out
          git fetch -q origin data/season-live:refs/remotes/origin/data/season-live || exit 0
          git show origin/data/season-live:sports-current.json > out/sports-current.json || rm -f out/sports-current.json
          git show origin/data/season-live:notify-state.json > out/notify-state.json || rm -f out/notify-state.json
      - name: Watch transfers and collect Sports.ru data
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '253172941' }}
        run: python scripts/season_watch.py out/sports-current.json out/notify-state.json --minutes 345 --every 60 --full-every 120
      - name: Start the next watch run
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run season-data.yml --ref "${{ github.ref_name }}"
