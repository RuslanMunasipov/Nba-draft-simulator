name: Season live data
# One long run at a time: FBL transfer journals every minute, the full Sports.ru collection every two hours.
# Each run lasts just under six hours and then starts the next one itself: GitHub schedules are best-effort
# and skipped runs are common, so the cron below is only a fallback. Cancel a run to stop the chain.
# A merge to the run's branch ends the run early (the watcher checks every five minutes), so the next run starts on
# the new code and data/fbl-league.json.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: season-live
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Start from the last published snapshot and alert state
        run: |
          mkdir -p out
          # The published state is what was already posted: a run that cannot read it must not start from nothing
          # (it would post the day's deals again and restart the protocol numbers). Only a missing branch is a first run.
          for i in 1 2 3 4 5; do
            git fetch -q origin data/season-live:refs/remotes/origin/data/season-live && break
            if [ "$i" = 5 ]; then
              code=0; git ls-remote --exit-code origin data/season-live >/dev/null || code=$?
              [ "$code" = 2 ] && exit 0
              echo "Cannot fetch data/season-live: not starting from an empty state"; exit 1
            fi
            sleep $((i * 15))
          done
          git show origin/data/season-live:sports-current.json > out/sports-current.json || rm -f out/sports-current.json
          git show origin/data/season-live:notify-state.json > out/notify-state.json || rm -f out/notify-state.json
          git show origin/data/season-live:injury-history.json > out/injury-history.json || rm -f out/injury-history.json
          git show origin/data/season-live:league-state.json > out/league-state.json || rm -f out/league-state.json
          git show origin/data/season-live:espn-box.json > out/espn-box.json || rm -f out/espn-box.json
      - name: Watch transfers and collect Sports.ru data
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # The league chat's feed (scripts/league-feed.mjs): its own bot and chat, never the personal ones.
          LEAGUE_TELEGRAM_CHAT_ID: ${{ secrets.LEAGUE_TELEGRAM_CHAT_ID }}
          LEAGUE_TELEGRAM_BOT_TOKEN: ${{ secrets.LEAGUE_TELEGRAM_BOT_TOKEN }}
          # Key of the encrypted Telegram usernames (data/telegram-handles.enc.json).
          LEAGUE_HANDLES_KEY: ${{ secrets.LEAGUE_HANDLES_KEY }}
        run: python scripts/season_watch.py out/sports-current.json out/notify-state.json --minutes 345 --every 60 --full-every 120
      - name: Start the next watch run
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do gh workflow run season-data.yml --ref "${{ github.ref_name }}" && exit 0; sleep $((i * 20)); done
          exit 1
