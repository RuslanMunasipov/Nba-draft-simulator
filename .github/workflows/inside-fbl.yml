name: Inside FBL
# Mike Roffon's weekly long read (awards-bot/inside-fbl.js): every Friday at 18:00 Moscow, and only then, a big interview
# with the guest of the week (the league week so far, Monday to Thursday's games), written by Claude through the owner's
# subscription, a picture per chapter and an opener drawn by OpenAI (about $0.15), published on Telegraph and posted
# into the league chat by Mike's bot: the opener and the link. The owner approves every issue first (23.10.2026):
#   - Friday morning (09:07-11:07 Moscow, once Thursday's games are posted) the draft: its Telegraph page, sent to the
#     owner by Mike's bot when INSIDE_FBL_REVIEW_CHAT_ID is set (his chat with the bot), its link in the run's summary;
#   - by hand: approve (it goes out at 18:00), or redo (written and drawn anew, with the owner's notes if any);
#   - from 14:07 Moscow the post runs wait for 18:00, read the state again and post an approved issue; one not approved
#     by then does not go out. GitHub's schedule is best-effort, so they start hours early (a post run by hand too).
# State and pictures live on the branch data/inside-fbl (the pictures are the pages', by their raw URLs).
on:
  schedule:
    - cron: '7 6,7,8 * * 5'
    - cron: '7 11,12,13,14 * * 5'
  workflow_dispatch:
    inputs:
      action:
        description: 'draft: the week''s page for review; approve: it goes out on Friday at 18:00; redo: written anew; post: wait for 18:00 and post if approved'
        type: choice
        options: [draft, approve, redo, post, picture]
        default: draft
      notes:
        description: 'For redo: what to change (the writer gets it as the editor''s wishes)'
        required: false
        default: ''
      guest:
        description: 'For draft/redo: gm:<1-8>, player:<ESPN id> or commissioner (empty: by the week''s story; redo keeps the guest)'
        required: false
        default: ''
      chapter:
        description: 'For picture: the chapter whose picture is drawn anew (1, 2, ...)'
        required: false
        default: ''
      scene:
        description: 'For picture: the new scene, in English'
        required: false
        default: ''
      text:
        description: 'For picture: the only letters it may show (like the player names on cards)'
        required: false
        default: ''
      week:
        description: 'A US day of the week, YYYY-MM-DD (empty: the week of yesterday)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  # The post runs wait hours for 18:00 in a group of their own, so an approval or a redo is never queued behind them.
  group: ${{ (github.event.schedule == '7 11,12,13,14 * * 5' || inputs.action == 'post') && 'inside-fbl-post' || 'inside-fbl' }}
  cancel-in-progress: false
jobs:
  longread:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Install Claude Code
        run: npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.308 && claude --version
      - name: Read the awards bot's archive and the long reads' branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/awards"
          for i in 1 2 3; do git fetch -q origin data/awards-bot:refs/remotes/origin/data/awards-bot && break; sleep $((i * 10)); done
          git show origin/data/awards-bot:state.json > "$RUNNER_TEMP/awards/state.json"
          git show origin/data/awards-bot:archive.json > "$RUNNER_TEMP/awards/archive.json"
          # The branch keeps every week's pictures: a clone that fails while the branch exists must not start it anew.
          if ! git clone -q --depth 1 --branch data/inside-fbl "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/inside"; then
            code=0; git ls-remote --exit-code origin data/inside-fbl >/dev/null || code=$?
            [ "$code" = 2 ] || { echo "Cannot clone data/inside-fbl"; exit 1; }
            mkdir -p "$RUNNER_TEMP/inside"
          fi
      - name: Draft, approve or post
        env:
          ACTION: ${{ github.event.schedule == '7 11,12,13,14 * * 5' && 'post' || github.event.schedule == '7 6,7,8 * * 5' && 'draft' || inputs.action }}
          AFTER: ${{ github.event.schedule == '7 6,7,8 * * 5' && '--after-thursday' || '' }}
          WEEK: ${{ inputs.week }}
          GUEST: ${{ inputs.guest }}
          NOTES: ${{ inputs.notes }}
          CHAPTER: ${{ inputs.chapter }}
          SCENE: ${{ inputs.scene }}
          TEXT: ${{ inputs.text }}
          AWARDS_CHAT_ID: ${{ secrets.AWARDS_CHAT_ID || secrets.LEAGUE_TELEGRAM_CHAT_ID }}
          MIKE_ROFFON_BOT_TOKEN: ${{ secrets.MIKE_ROFFON_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The league's Telegraph account (createAccount once), so the pages can be edited; without it each page gets
          # an account of its own.
          TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
          # The owner's chat with Mike's bot: the drafts go there for review.
          INSIDE_FBL_REVIEW_CHAT_ID: ${{ secrets.INSIDE_FBL_REVIEW_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          node awards-bot/bot.mjs --inside-fbl --state "$RUNNER_TEMP/awards" --inside "$RUNNER_TEMP/inside" --action "$ACTION"
          ${WEEK:+--inside-week "$WEEK"} ${GUEST:+--guest "$GUEST"} ${NOTES:+--notes "$NOTES"} ${CHAPTER:+--chapter "$CHAPTER"} ${SCENE:+--scene "$SCENE"} ${TEXT:+--text "$TEXT"} $AFTER
