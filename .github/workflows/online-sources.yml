name: Inspect online basketball sources
on:
  push:
    paths:
      - scripts/probe_online_sources.py
      - .github/workflows/online-sources.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/probe_online_sources.py
