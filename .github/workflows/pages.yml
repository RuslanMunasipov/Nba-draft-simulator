name: Test and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical data dependencies
        run: python -m pip install --disable-pip-version-check pyarrow==23.0.1 numpy==2.2.6
      - name: Audit and build historical profiles
        run: python scripts/audit_parquet.py
      - name: Test and evaluate experimental baseline
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/build_baseline.py
      - name: Fetch current rosters and build automatic draft database
        run: python scripts/build_default_database.py
      - uses: actions/cache@v4
        with:
          path: .cache/online
          key: online-evidence-${{ runner.os }}-${{ github.run_id }}
          restore-keys: online-evidence-${{ runner.os }}-
      - name: Fetch full careers, Summer League and current games
        run: python scripts/online_evidence.py
      - name: Preserve fetched evidence even if a later check fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/online
          key: online-evidence-${{ runner.os }}-${{ github.run_id }}
      - name: Apply published Yahoo analyst position evidence
        run: python scripts/apply_positions.py
      - name: Audit historical projection provenance
        run: python scripts/audit_projection_archive.py
      - name: Train and evaluate the career model in temporal order
        run: python scripts/career_model.py
      - name: Build and audit full-formula forecasts and ceilings
        run: python scripts/build_forecasts.py
      - name: Evaluate college-to-NBA rookie transfer
        run: python scripts/rookie_model.py
      - name: Complete forecasts for the entire player catalog
        run: python scripts/complete_forecasts.py
      - name: Apply verified Sports.ru prices and salary cap
        run: python scripts/apply_sports_prices.py
      - name: Independently audit all scoring terms and negative games
        run: python scripts/audit_scoring.py
      - name: Pack career evidence for mobile loading
        run: python scripts/pack_online_evidence.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test, build and verify
        run: npm run verify
      - name: Install browser for mobile smoke tests
        run: npx playwright install --with-deps chromium webkit
      - name: Verify automatic mobile startup and draft
        run: npm run test:browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install published-site verification dependencies
        run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify published mobile site
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run test:browser
