name: Test and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical data dependencies
        run: python -m pip install --disable-pip-version-check pyarrow==23.0.1
      - name: Audit and build historical profiles
        run: python scripts/audit_parquet.py
      - name: Test and evaluate experimental baseline
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/build_baseline.py
      - name: Fetch current rosters and build automatic draft database
        run: python scripts/build_default_database.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test, build and verify
        run: npm run verify
      - name: Install browser for mobile smoke tests
        run: npx playwright install --with-deps chromium
      - name: Verify automatic mobile startup and draft
        run: npm run test:browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install published-site verification dependencies
        run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify published mobile site
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run test:browser
