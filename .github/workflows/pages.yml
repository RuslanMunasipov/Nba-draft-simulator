name: Test and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical data dependencies
        run: python -m pip install --disable-pip-version-check pyarrow==23.0.1 numpy==2.2.6
      - name: Audit and build historical profiles
        run: python scripts/audit_parquet.py
      - name: Test and evaluate experimental baseline
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/build_baseline.py
          python scripts/inseason_calibration.py --check
      - name: Fetch current rosters and build automatic draft database
        run: python scripts/build_default_database.py
      - name: Restore collected NBA and NCAA history
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_BRANCH: data/history-foundation
          CHECKPOINT_NAME: history-checkpoint
          CHECKPOINT_PATH: .cache/history
        run: python scripts/restore_collection_checkpoint.py
      - name: Restore reconciled Summer League protocols
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_BRANCH: data/history-foundation
          CHECKPOINT_NAME: summer-league-protocols
          CHECKPOINT_PATH: .cache/summer-games
        run: python scripts/restore_collection_checkpoint.py
      - name: Fetch optional Yahoo transfer-position reference
        run: python scripts/apply_positions.py
      - name: Apply verified Sports.ru prices, draft positions and salary cap
        run: python scripts/apply_sports_prices.py
      - name: Attach collected personal history to prediction inputs
        run: python scripts/attach_collected_history.py
      - name: Audit historical projection provenance
        run: python scripts/audit_projection_archive.py
      - name: Train and evaluate the career model in temporal order
        run: python scripts/career_model.py
      - name: Build and audit full-formula forecasts and ceilings
        run: python scripts/build_forecasts.py
      - name: Evaluate college-to-NBA rookie transfer
        run: python scripts/rookie_model.py
      - name: Complete forecasts for the entire player catalog
        run: python scripts/complete_forecasts.py
      - name: ESPN team context (BPI projected wins, depth charts)
        continue-on-error: true
        run: python scripts/espn_team_context.py
      - name: Train, hold out and apply the career projection model (2002-2026 game logs)
        run: python scripts/projection_model.py
      - name: Check the acceptance figures against the model just built
        # The unit tests above run before the build, without public/data, so they skip this comparison.
        run: python -m unittest tests.test_docs_truth
      - name: Independently audit all scoring terms and negative games
        run: python scripts/audit_scoring.py
      - name: Attach official Sports.ru fantasy points per season and audit forecasts
        run: python scripts/apply_sports_history.py
      - name: Bundle a Sports.ru live snapshot as fallback for the season tab
        continue-on-error: true
        # The season tab reads the live branch first; a slow Sports.ru must never hold the deployment.
        timeout-minutes: 8
        run: python scripts/collect_sports_current.py public/data/sports-current.json
      - name: Pack career evidence for mobile loading
        run: python scripts/pack_online_evidence.py
      - name: Preserve generated model and integration audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-integration-audits
          path: |
            public/data/*audit*.json
            public/data/history-integration-audit.json
            public/data/forecast-coverage.json
            public/data/projection-model-audit.json
            public/data/default-draft.json
          if-no-files-found: warn
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test, build and verify
        run: npm run verify
      - name: Slim the site's player database (after the build's checks; the artifact above keeps it whole)
        run: python scripts/slim_database.py dist/data/default-draft.json
      - name: Browser smoke test on a phone viewport
        timeout-minutes: 10
        run: |
          npx playwright install --with-deps chromium
          node scripts/e2e-smoke.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
