name: League feed sample
# Manual only, never on a schedule: sends the latest league-feed protocol, headed as a sample, to the owner's personal
# chat, so it can be forwarded to the commissioner. Nothing is remembered as posted; the watcher never runs this.
on:
  workflow_dispatch:
    inputs:
      picture:
        description: "Draw Zak Onn's picture for the sample (OpenAI, paid: about $0.02)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # The bots' texts are written by Claude through the owner's subscription (scripts/claude-text.mjs): the Claude Code
      # CLI, pinned. A failed install only leaves the bots without written texts.
      - name: Install Claude Code
        continue-on-error: true
        run: npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.308 && claude --version
      - name: Latest Sports.ru snapshot
        run: |
          mkdir -p out
          git fetch -q origin data/season-live:refs/remotes/origin/data/season-live
          git show origin/data/season-live:sports-current.json > out/sports-current.json
      - name: Send one sample protocol to the owner
        env:
          LEAGUE_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LEAGUE_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LEAGUE_FEED_PREVIEW: '1'
          # The subscription token of Claude Code (`claude setup-token`) for the bots' texts; no API key.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # His picture (scripts/zak-pictures.mjs) only when the run asks for it: the OpenAI key is passed for that run alone.
          LEAGUE_FEED_PICTURE: ${{ inputs.picture && '1' || '' }}
          OPENAI_API_KEY: ${{ inputs.picture && secrets.OPENAI_API_KEY || '' }}
        run: node scripts/league-feed.mjs out/sports-current.json out/sample-state.json
