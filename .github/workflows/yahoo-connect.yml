name: Connect Yahoo league
on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Code from Yahoo after "Agree", or the whole address from the browser bar (valid ~10 minutes)'
        required: true
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exchange the one-time code for an encrypted refresh token
        # The code is read from the event payload by the script (masked there), never placed in env.
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REDIRECT_URI: ${{ secrets.YAHOO_REDIRECT_URI }}
        run: |
          mkdir -p auth && python scripts/yahoo.py exchange auth/yahoo-token.enc
      - name: Store it on the data/yahoo-auth branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd auth
          git init -q -b data/yahoo-auth
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yahoo-token.enc && git commit -qm 'Encrypted Yahoo refresh token'
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data/yahoo-auth
