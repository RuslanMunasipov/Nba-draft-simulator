name: Audit source availability (no model tests)
on:
  push:
    branches: [data/history-foundation]
    paths:
      - scripts/audit_data_sources.py
      - .github/workflows/source-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect public source responses only
        run: python scripts/audit_data_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-availability-audit
          path: data/source-audit.json
