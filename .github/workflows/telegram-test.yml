name: Telegram test
# Manual: sends the latest league-feed protocol, marked as a test, to the personal chat (TELEGRAM_CHAT_ID), so the
# format can be seen before the league chat is connected. Nothing is remembered as posted.
on:
  workflow_dispatch:
    inputs:
      protocols:
        description: 'How many of the latest protocols to send'
        default: '1'
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Latest Sports.ru snapshot
        run: |
          mkdir -p out
          git fetch -q origin data/season-live:refs/remotes/origin/data/season-live
          git show origin/data/season-live:sports-current.json > out/sports-current.json
      - name: Send
        env:
          LEAGUE_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LEAGUE_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LEAGUE_FEED_PREVIEW: ${{ github.event.inputs.protocols }}
        run: node scripts/league-feed.mjs out/sports-current.json out/preview-state.json
