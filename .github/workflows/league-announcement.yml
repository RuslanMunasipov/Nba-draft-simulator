name: League announcement
# Manual only: posts one statement of Зак Онн (a file from data/announcements/) with his photo to the league chat,
# through the league bot. Run it once per statement.
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Announcement file in data/announcements/'
        default: '2026-10-20-school-shooters.html'
      photo:
        description: 'Photo of Зак Онн: check (frowning), approved (thumbs up) or violation (thumbs down)'
        default: 'check'
      picture:
        description: "Draw the statement's picture from <file>.picture.txt (OpenAI, paid: about $0.03)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The Telegram formatting reads the season's calendar (src/season.js), which needs the project's packages.
      - run: npm ci --no-audit --no-fund
      - name: Post to the league chat
        env:
          LEAGUE_TELEGRAM_BOT_TOKEN: ${{ secrets.LEAGUE_TELEGRAM_BOT_TOKEN }}
          LEAGUE_TELEGRAM_CHAT_ID: ${{ secrets.LEAGUE_TELEGRAM_CHAT_ID }}
          LEAGUE_HANDLES_KEY: ${{ secrets.LEAGUE_HANDLES_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILE: ${{ github.event.inputs.file }}
          PHOTO: ${{ github.event.inputs.photo }}
          # The OpenAI key only for a run that asks for the picture.
          ANNOUNCE_PICTURE: ${{ inputs.picture && '1' || '' }}
          OPENAI_API_KEY: ${{ inputs.picture && secrets.OPENAI_API_KEY || '' }}
        run: |
          case "$FILE" in */*|..*) echo "file name only"; exit 1;; esac
          node scripts/league-announce.mjs "data/announcements/$FILE" "$PHOTO"
