name: Christopher Dildo
# Manual only: posts one of Christopher Dildo's own words (a file of data/dildo/, written once and kept there: his
# introduction to the league, awards-bot/dildo.js) as it is into the league chat by his own bot, with its picture: its
# prompt written by Claude from the post, ultra-realistic with his face as in the reference, drawn by OpenAI (about $0.03).
# Never his bare reference photo: without a picture the post goes as text. Never from another bot: without
# CHRISTOPHER_DILDO_BOT_TOKEN the run fails. Run it once per file; send off prints it only (nothing drawn, nothing billed).
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'File in data/dildo/'
        default: '2026-10-24-intro.html'
      send:
        description: 'Post it into the league chat (off: printed only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: christopher-dildo
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # The picture's prompt is written by Claude through the owner's subscription (scripts/claude-text.mjs).
      - name: Install Claude Code
        continue-on-error: true
        run: npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.308 && claude --version
      - name: Post to the league chat
        env:
          CHRISTOPHER_DILDO_BOT_TOKEN: ${{ secrets.CHRISTOPHER_DILDO_BOT_TOKEN }}
          AWARDS_CHAT_ID: ${{ secrets.AWARDS_CHAT_ID || secrets.LEAGUE_TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The OpenAI key only for a run that posts (the picture is paid).
          OPENAI_API_KEY: ${{ inputs.send && secrets.OPENAI_API_KEY || '' }}
          FILE: ${{ inputs.file }}
          SEND: ${{ inputs.send && '1' || '' }}
        run: |
          case "$FILE" in */*|..*) echo "file name only"; exit 1;; esac
          node awards-bot/bot.mjs --dildo-post "data/dildo/$FILE" ${SEND:+--send}
